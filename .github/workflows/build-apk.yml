name: Build and Release Debug APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG_NAME" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "Debug APK Release $TAG_NAME" \
            --notes "Automated debug APK build from commit ${{ github.sha }}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "## Build & Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **AGP Version**: 9.1.1 (confirmed from gradle/libs.versions.toml)" >> $GITHUB_STEP_SUMMARY
          echo "- **Java Version Requirement**: Java 17" >> $GITHUB_STEP_SUMMARY
          echo "- **Gradle Version**: 9.3.1" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Command**: \`gradle :app:assembleDebug --stacktrace --no-daemon\`" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Path**: \`app/build/outputs/apk/debug/app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Actions Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Tag Format**: \`v\${{ github.run_number }}.\${{ github.run_attempt }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Release Asset Filename**: \`app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "- **Release Publishing Status**: **Succeeded** (Directly downloadable APK available in latest release)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Release Publishing Status**: **Failed / Skipped** (Actions artifact 'app-debug-apk' remains safely available)" >> $GITHUB_STEP_SUMMARY
          fi
